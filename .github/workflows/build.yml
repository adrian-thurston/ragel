name: Build and Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool

      # The host language toolchains the ragel test suite drives. Without
      # these every ragel.d case for a language other than C is a skip, so
      # the D, Java, Ruby, C#, Go, OCaml, Rust, Julia and JavaScript backends
      # go unexercised. The set matches the Dockerfile at the repository root,
      # which is the same list for the same reason; see it for what each
      # package buys and why mono comes from the archive rather than from
      # mono-project.com. Not installed here either: crack, which is
      # unpackaged, and asm, which needs no toolchain beyond $CC (the
      # runners are x86-64, so the asm cases do run).
      - name: Install host language toolchains
        run: |
          sudo apt-get install -y --no-install-recommends \
            gobjc gnustep-make libgnustep-base-dev \
            golang-go default-jdk ruby nodejs ocaml rustc gdc mono-devel

      # Zig and Julia are not in the ubuntu archive, so they come from the
      # upstream binary tarballs, sha256 pinned. The runners are x86-64
      # only, so unlike the Dockerfile there is no aarch64 arm here.
      # Bumping either version means bumping its shasum, published in
      # ziglang.org/download/index.json and in
      # julialang-s3.julialang.org/bin/checksums/julia-$VERSION.sha256.
      - name: Install zig
        env:
          ZIG_VERSION: 0.16.0
          ZIG_SHA256: 70e49664a74374b48b51e6f3fdfbf437f6395d42509050588bd49abe52ba3d00
        run: |
          set -eux
          tarball="zig-x86_64-linux-$ZIG_VERSION.tar.xz"
          curl -fsSL -o "/tmp/$tarball" \
            "https://ziglang.org/download/$ZIG_VERSION/$tarball"
          echo "$ZIG_SHA256  /tmp/$tarball" | sha256sum -c -
          sudo mkdir -p /opt/zig
          sudo tar -xJf "/tmp/$tarball" -C /opt/zig --strip-components=1
          sudo ln -s /opt/zig/zig /usr/local/bin/zig
          zig version

      - name: Install julia
        env:
          JULIA_VERSION: 1.12.7
          JULIA_SHA256: 4e7e9e776634d24835250de67cde39b0d4af15bc432eb20697e6be6c28ea69e8
        run: |
          set -eux
          tarball="julia-$JULIA_VERSION-linux-x86_64.tar.gz"
          series="$(echo "$JULIA_VERSION" | sed 's/\.[0-9]*$//')"
          curl -fsSL -o "/tmp/$tarball" \
            "https://julialang-s3.julialang.org/bin/linux/x64/$series/$tarball"
          echo "$JULIA_SHA256  /tmp/$tarball" | sha256sum -c -
          sudo mkdir -p /opt/julia
          sudo tar -xzf "/tmp/$tarball" -C /opt/julia --strip-components=1
          sudo ln -s /opt/julia/bin/julia /usr/local/bin/julia
          julia --version

      - name: autogen
        run: ./autogen.sh

      - name: configure
        run: ./configure

      # What configure found, so a backend that silently went missing is
      # visible in the log rather than showing up as a drop in skips.
      - name: report host languages
        run: grep -E '^(D|JAVAC|RUBY|CSHARP|GO|OCAML|RUST|JULIA|ZIG)_BIN|^GNUSTEP_CONFIG' config.log | sort -u || true

      - name: make
        run: make -j$(nproc)

      # The harness exits 2 when a case fails, so this fails the job.
      - name: make check
        run: make check

      # A failing case leaves a .diff in its suite's working/ directory with
      # the differences and the commands that produced them.
      - name: collect failure diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-diffs
          path: test/*/working/*.diff
          if-no-files-found: ignore

  # The CMake build, which the job above never touches. Each leg builds the
  # whole tree, examples included, installs it, and checks that what it
  # installed works. BUILD_SHARED_LIBS=OFF is CMake's default.
  cmake:
    name: cmake (BUILD_SHARED_LIBS=${{ matrix.shared }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shared: ['ON', 'OFF']
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile's list, less autotools. The runner image carries a
      # cmake of its own that may come first on PATH, so configure prints
      # the version it got.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake

      # The prefix has to be given here, not to cmake --install: colm bakes
      # its include and library directories in, and the executables get
      # their rpath, at configure time.
      - name: configure
        run: |
          cmake --version
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=${{ matrix.shared }} \
            -DCOLM_BUILD_EXAMPLES=ON \
            -DCMAKE_INSTALL_PREFIX="$PWD/inst"

      - name: build
        run: cmake --build build -j$(nproc)

      - name: install
        run: cmake --install build

      # The libcolm soname carries the whole colm version, numeric part only,
      # so that a newer release installed beside an older one doesn't take
      # over the older one's programs.
      - name: check libcolm soname
        if: matrix.shared == 'ON'
        run: |
          set -eux
          version=$(sed -n 's/^COLM_VERSION="\(.*\)"$/\1/p' configure.ac)
          numeric=$(echo "$version" | grep -oE '^[0-9]+(\.[0-9]+)*')
          soname=$(readelf -d inst/lib/libcolm.so | sed -n 's/.*(SONAME).*\[\(.*\)\]$/\1/p')
          test "$soname" = "libcolm.so.$numeric"

      # Compile and run a colm program against the installed runtime, and a
      # ragel example with the installed ragel. Each output is assigned
      # before the test so that -e sees the program's exit status.
      - name: run installed colm and ragel
        run: |
          set -eux
          mkdir smoke
          echo 'print "hello from colm\n"' > smoke/hello.lm
          inst/bin/colm -o smoke/hello smoke/hello.lm
          out=$(smoke/hello)
          test "$out" = "hello from colm"
          inst/bin/ragel -o smoke/atoi.cpp examples/atoi.rl
          c++ -o smoke/atoi smoke/atoi.cpp
          out=$(echo -1234 | smoke/atoi)
          test "$out" = "-1234"

      # The colm and ragel package version files accept a request only for
      # the installed major and minor version (SameMinorVersion). Each
      # request configures a project of its own, against the version numbers
      # in configure.ac. When the minor version is 0 there is no older minor
      # to ask for, so an older major stands in for it.
      - name: check package version policy
        run: |
          set -eu
          mkdir pkgver
          cat > pkgver/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(pkgver NONE)
          find_package(${PKG} ${REQ} QUIET)
          if(${PKG}_FOUND)
            set(got found)
          else()
            set(got missing)
          endif()
          if(NOT got STREQUAL WANT)
            message(FATAL_ERROR "find_package(${PKG} ${REQ}): ${got}, want ${WANT}")
          endif()
          EOF
          n=0
          check() {
            n=$((n + 1))
            cmake -S pkgver -B pkgver/build$n -DCMAKE_PREFIX_PATH="$PWD/inst" \
              -DPKG="$1" -DREQ="$2" -DWANT="$3" > /dev/null
            echo "find_package($(echo $1 ${2//;/ })): $3"
          }
          for pkg in colm ragel; do
            var=$(echo $pkg | tr a-z A-Z)_VERSION
            version=$(sed -n "s/^$var=\"\(.*\)\"$/\1/p" configure.ac)
            numeric=$(echo "$version" | grep -oE '^[0-9]+(\.[0-9]+)*')
            major=${numeric%%.*}
            minor=$(echo "$numeric" | cut -d. -f2)
            check $pkg "" found
            check $pkg $major.$minor found
            check $pkg "$numeric;EXACT" found
            check $pkg "$major.$minor...<$major.$((minor + 1))" found
            check $pkg "$major.$minor...<$((major + 1))" missing
            if [ "$minor" -gt 0 ]; then
              check $pkg $major.$((minor - 1)) missing
              check $pkg $major missing
            elif [ "$major" -gt 0 ]; then
              check $pkg $((major - 1)).0 missing
            fi
          done

      # A project that finds both packages at their own major and minor
      # version, builds a colm program through colm::colm and colm::libcolm
      # and a ragel example through ragel::ragel, and runs them.
      - name: build a project against the installed packages
        run: |
          set -eux
          colm=$(sed -n 's/^COLM_VERSION="\([0-9]*\.[0-9]*\).*"$/\1/p' configure.ac)
          ragel=$(sed -n 's/^RAGEL_VERSION="\([0-9]*\.[0-9]*\).*"$/\1/p' configure.ac)
          mkdir consumer
          echo 'print "hello from colm\n"' > consumer/hello.lm
          cat > consumer/main.c <<'EOF'
          #include <colm/colm.h>

          int main( int argc, const char **argv )
          {
            struct colm_program *prg = colm_new_program( &colm_object );
            colm_run_program( prg, argc, argv );
            return colm_delete_program( prg );
          }
          EOF
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(consumer C CXX)
          find_package(colm ${COLM} REQUIRED)
          find_package(ragel ${RAGEL} REQUIRED)
          add_custom_command(OUTPUT hello.c
            COMMAND colm::colm -c -o hello.c "${CMAKE_SOURCE_DIR}/hello.lm"
            DEPENDS hello.lm)
          add_executable(hello main.c hello.c)
          target_link_libraries(hello PRIVATE colm::libcolm)
          add_custom_command(OUTPUT atoi.cpp
            COMMAND ragel::ragel -o atoi.cpp "${ATOI}"
            DEPENDS "${ATOI}")
          add_executable(atoi atoi.cpp)
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/inst" \
            -DCOLM="$colm" -DRAGEL="$ragel" -DATOI="$PWD/examples/atoi.rl"
          cmake --build consumer/build
          out=$(consumer/build/hello)
          test "$out" = "hello from colm"
          out=$(echo -1234 | consumer/build/atoi)
          test "$out" = "-1234"

      # The libcolm soname carries the whole colm version, so libragel needs
      # exactly the colm it was built against. A copy of the installed colm
      # package, one minor version up, stands in for another colm installed
      # elsewhere. find_package(ragel) has to pass over it when it comes
      # first on the search path, and refuse it when the project has already
      # loaded it: at the top level, inside a function, or as Colm. When the
      # project has already loaded the right colm, by finding colm or ragel,
      # find_package(colm) has to refuse the other one, and ragel has to be
      # found after that. A colm that records no version, from before colm
      # recorded one, is refused by both, and neither package leaves the
      # variable its check uses set. Found through ragel_DIR alone, in the
      # install or in the build tree, ragel has to find the colm beside it.
      # The last case reconfigures the build tree, so it comes after the
      # build tree case: it sets colm's and ragel's package directories
      # apart, gives a relative prefix typed as a STRING, which CMake keeps
      # as given, and installs under another prefix. Each case configures a
      # project of its own, and nothing is built, so the copied library keeps
      # its old soname.
      - name: check ragel loads the colm it was built against
        run: |
          set -eu
          version=$(sed -n 's/^COLM_VERSION="\(.*\)"$/\1/p' configure.ac)
          numeric=$(echo "$version" | grep -oE '^[0-9]+(\.[0-9]+)*')
          major=${numeric%%.*}
          minor=$(echo "$numeric" | cut -d. -f2)
          other=$major.$((minor + 1)).0
          mkdir -p other/bin other/lib/cmake
          cp inst/bin/colm other/bin/
          cp -r inst/lib/cmake/colm other/lib/cmake/
          if [ "${{ matrix.shared }}" = ON ]; then
            cp inst/lib/libcolm.so.$numeric other/lib/libcolm.so.$other
          else
            cp inst/lib/libcolm.a other/lib/
          fi
          sed -i "s/${numeric//./\\.}/$other/g" other/lib/cmake/colm/*.cmake
          mkdir ragelcolm
          cat > ragelcolm/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.16)
          project(ragelcolm NONE)
          macro(check_unset)
            foreach(var _colm_loaded _ragel_colm_loaded)
              if(DEFINED ${var})
                message(FATAL_ERROR "${var} left set: ${${var}}")
              endif()
            endforeach()
          endmacro()
          function(preload_in_function)
            find_package(${PRELOAD} REQUIRED)
          endfunction()
          if(PRELOAD AND IN_FUNCTION)
            preload_in_function()
          elseif(PRELOAD)
            find_package(${PRELOAD} REQUIRED)
          endif()
          if(AGAIN)
            find_package(colm ${AGAIN} EXACT QUIET)
            check_unset()
            if(colm_FOUND)
              set(got found)
            else()
              set(got "${colm_NOT_FOUND_MESSAGE}")
            endif()
            if(NOT got STREQUAL WANT_AGAIN)
              message(FATAL_ERROR "colm ${AGAIN} got: ${got}\nwant: ${WANT_AGAIN}")
            endif()
          endif()
          find_package(ragel QUIET)
          check_unset()
          if(ragel_FOUND)
            get_target_property(libcolm colm::libcolm LOCATION)
            get_filename_component(got "${libcolm}" DIRECTORY)
          else()
            set(got "${ragel_NOT_FOUND_MESSAGE}")
          endif()
          if(NOT got STREQUAL WANT)
            message(FATAL_ERROR "got: ${got}\nwant: ${WANT}")
          endif()
          EOF
          cmake -S ragelcolm -B ragelcolm/build1 \
            -DCMAKE_PREFIX_PATH="$PWD/other;$PWD/inst" \
            -DWANT="$PWD/inst/lib" > /dev/null
          echo "colm $other first on the search path: passed over"
          refused="ragel was built against colm $numeric, but colm $other is already loaded"
          cmake -S ragelcolm -B ragelcolm/build2 \
            -DCMAKE_PREFIX_PATH="$PWD/inst;$PWD/other" -DPRELOAD="colm;$other;EXACT" \
            -DWANT="$refused" > /dev/null
          echo "colm $other already loaded: refused"
          cmake -S ragelcolm -B ragelcolm/build3 \
            -DCMAKE_PREFIX_PATH="$PWD/inst;$PWD/other" -DPRELOAD="colm;$other;EXACT" \
            -DIN_FUNCTION=ON -DWANT="$refused" > /dev/null
          echo "colm $other already loaded inside a function: refused"
          cmake -S ragelcolm -B ragelcolm/build4 \
            -DCMAKE_PREFIX_PATH="$PWD/inst;$PWD/other" -DPRELOAD="Colm;$other;EXACT" \
            -DWANT="$refused" > /dev/null
          echo "colm $other already loaded as Colm: refused"
          cmake -S ragelcolm -B ragelcolm/build5 \
            -DCMAKE_PREFIX_PATH="$PWD/inst;$PWD/other" -DPRELOAD="colm;$numeric;EXACT" \
            -DAGAIN=$other -DWANT_AGAIN="colm $numeric is already loaded" \
            -DWANT="$PWD/inst/lib" > /dev/null
          echo "colm $numeric already loaded: colm $other refused, ragel found"
          cmake -S ragelcolm -B ragelcolm/build6 \
            -DCMAKE_PREFIX_PATH="$PWD/inst;$PWD/other" -DPRELOAD=ragel \
            -DAGAIN=$other -DWANT_AGAIN="colm $numeric is already loaded" \
            -DWANT="$PWD/inst/lib" > /dev/null
          echo "ragel already loaded: colm $other refused, ragel found"
          cp -r other old
          sed -i '/^  COLM_VERSION /d' old/lib/cmake/colm/colm-targets.cmake
          unknown="colm of unknown version is already loaded"
          cmake -S ragelcolm -B ragelcolm/build7 \
            -DCMAKE_PREFIX_PATH="$PWD/inst;$PWD/old" -DPRELOAD="colm;$other;EXACT" \
            -DAGAIN=$numeric -DWANT_AGAIN="$unknown" \
            -DWANT="ragel was built against colm $numeric, but $unknown" > /dev/null
          echo "colm that records no version already loaded: refused by colm and ragel"
          cmake -S ragelcolm -B ragelcolm/build8 \
            -Dragel_DIR="$PWD/inst/lib/cmake/ragel" \
            -DWANT="$PWD/inst/lib" > /dev/null
          echo "ragel_DIR alone: colm beside ragel found"
          cmake -S ragelcolm -B ragelcolm/build9 \
            -Dragel_DIR="$PWD/inst/lib/cmake/ragel" -DCMAKE_PREFIX_PATH="$PWD/other" \
            -DWANT="$PWD/inst/lib" > /dev/null
          echo "ragel_DIR, colm $other on the search path: colm beside ragel found"
          cmake -S ragelcolm -B ragelcolm/build10 \
            -Dragel_DIR="$PWD/build" -DCMAKE_PREFIX_PATH="$PWD/other" \
            -DWANT="$PWD/build/src/colm" > /dev/null
          echo "build tree ragel_DIR, colm $other on the search path: colm beside ragel found"
          cmake -S . -B build -DCMAKE_INSTALL_PREFIX:STRING=alt \
            -DCMAKE_INSTALL_CMAKEDIR=share/cmake/colm \
            -DCMAKE_INSTALL_CMAKEDIR_RAGEL=lib/cmake/ragel-7 > /dev/null
          cmake --install build --prefix "$PWD/alt" > /dev/null
          cmake -S ragelcolm -B ragelcolm/build11 \
            -Dragel_DIR="$PWD/alt/lib/cmake/ragel-7" -DCMAKE_PREFIX_PATH="$PWD/other" \
            -DWANT="$PWD/alt/lib" > /dev/null
          echo "package directories set apart, ragel_DIR: colm beside ragel found"

  # The colm manual, which neither job above builds. It renders only the book,
  # so that the check of its links, doc/colm/colm-links.rb, runs on every
  # change and fails the job on a link that leads nowhere in the book. It
  # builds with cmake: autotools' --enable-manual builds the ragel guide too,
  # which needs asciidoc, fig2dev and dblatex, while COLM_BUILD_MANUAL builds
  # only the colm manual, and its colm-manual target compiles nothing.
  # ruby-rouge highlights the examples, with doc/colm/colm-rouge.rb, as in a
  # build where Rouge is installed.
  manual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake asciidoctor ruby-rouge

      - name: versions
        run: |
          asciidoctor --version
          ruby -e 'require "rouge"; puts "rouge #{Rouge.version}"'

      - name: configure
        run: cmake -S . -B build -DCOLM_BUILD_MANUAL=ON

      - name: build the manual
        run: cmake --build build --target colm-manual
